alerts:
  - name: high_tail_latency
    severity: critical
    condition: 'Latency P95 > 3000ms và error budget consumption trên 50%'
    duration: 5m
    type: symptom-based
    channel: slack
    sli: primary_slo.fast_successful_requests
    owner: platform-oncall
    runbook: docs/alerts.md#alert-1
  - name: elevated_error_rate
    severity: warning
    condition: 'Error rate > 2% hoặc retrieval success rate < 90%'
    duration: 10m
    type: symptom-based
    channel: slack
    sli: guardrails.error_rate_pct_max
    owner: platform-oncall
    runbook: docs/alerts.md#alert-2
  - name: low_quality_proxy
    severity: warning
    condition: 'Quality score trung bình < 0.75 (proxy)'
    duration: 15m
    type: symptom-based
    channel: slack
    sli: guardrails.quality_score_avg_min
    owner: platform-oncall
    runbook: docs/alerts.md#alert-3
